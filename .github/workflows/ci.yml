name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          cd "$HOME/bin"
          fetch() { curl -fsSL -o tool.zip "$1" && unzip -o -q tool.zip && rm tool.zip; }
          fetch https://github.com/rojo-rbx/rojo/releases/download/v7.5.1/rojo-7.5.1-linux-x86_64.zip
          fetch https://github.com/Kampfkarren/selene/releases/download/0.29.0/selene-0.29.0-linux.zip
          fetch https://github.com/JohnnyMorganz/StyLua/releases/download/v2.1.0/stylua-linux-x86_64.zip
          fetch https://github.com/lune-org/lune/releases/download/v0.10.4/lune-0.10.4-linux-x86_64.zip
          fetch https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.0/luau-lsp-linux-x86_64.zip
          curl -fsSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.0/scripts/globalTypes.d.luau
          chmod +x rojo selene stylua lune luau-lsp
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Format
        run: stylua --check src tests

      - name: Lint
        run: selene src

      - name: Type check
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --definitions="$HOME/bin/globalTypes.d.luau" --sourcemap=sourcemap.json src/

      - name: Unit tests
        run: lune run tests/run.luau

      - name: Build place
        run: rojo build default.project.json -o DoubleClick.rbxl

      - uses: actions/upload-artifact@v4
        with:
          name: DoubleClick-beta-place
          path: DoubleClick.rbxl
